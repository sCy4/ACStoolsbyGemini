    <p data-t="s1_desc" style="margin:0 0 18px 0; font-size:14.5px; color:#44403A;"></p>

      <div style="background:#FFFFFF; border:2px solid #191919; padding:18px 22px;">

        <div data-t="op3_desc" style="font-size:12.5px; font-weight:700; line-height:1.4;"></div>

      <div style="background:#FFFFFF; border:2px solid #191919; padding:16px 8px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;">
        <span data-t="op4_key" style="font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; background:#FFF7DB; border:2px solid #191919; border-bottom-width:5px; padding:6px 12px; min-width:44px;"></span>
        <div id="op4desc" style="font-size:12.5px; font-weight:700; line-height:1.4;"></div>

        <div id="vid2" style="position:relative; width:100%; padding-top:56.25%; border:2px solid #191919; background:#000;"></div>
      </div>
    </div>

      <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap;">
        <div style="width:32px; height:32px; background:#FFD94A; border:2px solid #191919; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-family:'Space Grotesk',monospace; font-size:16px; font-weight:700; flex-shrink:0;">3</div>
        <div data-t="fn3_name" style="font-size:18px; font-weight:900;"></div>
        <div data-t="fn3_tag" style="font-size:12.5px; color:#6E6A63; background:linear-gradient(transparent 55%, #FFEEA8 55%); padding:0 4px; font-weight:500;"></div>
      </div>
      <ol style="margin:8px 0 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px;">
        <li style="display:flex; gap:10px; align-items:baseline;"><span style="width:20px; height:20px; background:#191919; color:#FFD94A; border-radius:50%; font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; transform:translateY(3px);">1</span><span data-t="fn3_step1"></span></li>

        <div id="vid3" style="position:relative; width:100%; padding-top:56.25%; border:2px solid #191919; background:#000;"></div>

    <div style="background:#191919; color:#FFFFFF; border:2px solid #191919; box-shadow:5px 5px 0 #FFD94A; padding:16px 22px; margin-bottom:26px; display:flex; gap:14px; align-items:baseline; font-size:13.5px; line-height:1.7;">

        <div style="width:32px; height:32px; background:#FFD94A; border:2px solid #191919; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-family:'Space Grotesk',monospace; font-size:16px; font-weight:700; flex-shrink:0;">4</div>

      <div style="font-size:20px; font-weight:700; flex-shrink:0;">→</div>

(function () {

  /* 1) 純文字：填入所有 data-t 元素 */
